// Replacement for the android/build.gradle of the `stockfish` 1.8.1 plugin.
// The published file targets Gradle 4 / AGP 3.5 (jcenter(), its own buildscript, compileSdkVersion) which no longer
// builds with Gradle 9 / AGP 9. Only the build script changes; sources and CMakeLists.txt are the plugin's own.
group 'com.stockfish'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.arjanaswal.stockfish'
    compileSdk 35

    defaultConfig {
        minSdk 21
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}
