name: Build 3D Chess APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build (analyze, tests, release APK)
        run: |
          set -o pipefail
          bash tools/build.sh 2>&1 | tee build.log

      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -n -E "^e: |error •|error:|Error:|FAILED|What went wrong|Exception|Could not|Unresolved|Execution failed|AssertionError|Some tests failed|\[E\]" build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          echo "::error::LAST LINES: $(tail -n 25 build.log | tr '\n' '|' | cut -c1-1200)"

      - name: Package the editable Flutter project
        if: success()
        run: |
          mkdir -p dist
          zip -rq dist/chess3d_flutter_project.zip . \
            -x ".git/*" "build/*" ".dart_tool/*" "dist/*" "tools/node_modules/*" "android/.gradle/*" "android/local.properties" \
               "android/app/build/*" "android/build/*" "*/.cxx/*" "packages/*/android/build/*" "*.log" ".flutter-plugins*" ".idea/*"
          ls -la dist

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess3d
          path: dist/*
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" dist/chess3d-release.apk dist/chess3d_flutter_project.zip \
            --title "3D Chess (Flutter) $TAG" --target "${{ github.sha }}" \
            --notes "Native Flutter + Filament build. arm64 release APK signed with the debug key (sideload). Built by CI: analyze + tests passed; not yet verified on a physical device."
