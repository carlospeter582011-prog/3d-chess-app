name: Android APK and AAB
on:
  workflow_dispatch:
  push:
    branches:
      - feature/board-camera-admob-enhancements
      - main
  pull_request:
    paths:
      - 'lib/**'
      - 'android_overlay/**'
      - 'pubspec.yaml'
      - 'tools/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, analyze and test
        run: bash tools/build.sh
      - name: Upload APK and AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess3d-android-builds
          path: |
            dist/chess3d-release.apk
            dist/chess3d-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK and AAB to GitHub Releases
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-android-build${{ github.run_number }}"
          gh release create "$TAG" \
            dist/chess3d-release.apk \
            dist/chess3d-release.aab \
            --title "3D Chess Android $TAG" \
            --target "${{ github.sha }}" \
            --prerelease \
            --notes "Android 6+ ARM64 test build. APK for sideloading; AAB is debug-key signed and NOT suitable for Google Play production. AdMob test IDs only. CI tests passed; physical-device compatibility not yet verified."
